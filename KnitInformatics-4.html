.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;height:auto}
.title{display:block;width:min(430px,100%);height:auto}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start;margin-top:8px}
.left{position:sticky;top:6px;--sw:min(100%,max(300px,calc((100vh - 388px) * 1.45 + 2 * var(--fw))))}

.right{display:flex;flex-direction:column;gap:16px;min-width:0}
@media(max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.left{position:static;--sw:min(100%,640px)}.page{padding:10px 16px 40px}}
/* status */
.status{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:rgba(251,245,234,.8);border:2px dashed rgba(116,84,33,.5);font-size:13px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--soft)}
.pill[data-mode=reflecting] .dot{background:#D9602B}
.pill[data-mode=revising] .dot,.pill[data-mode=replying] .dot{background:#E2B33B;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* tabs */
.tabs{position:relative;display:flex;justify-content:space-between;padding:0 6%;margin-top:4px}
.tabs button{border:0;background:none;cursor:pointer;color:var(--brown);font-size:clamp(22px,2.5vw,34px);line-height:1.2;padding:2px 10px 10px;
  transition:color .45s ease,transform .45s cubic-bezier(.3,1.6,.5,1)}
.tabs button:hover{color:color-mix(in srgb,var(--brown) 60%,var(--accent))}
.tabs button[aria-pressed=true]{color:var(--accent);transform:translateY(-3px) scale(1.06)}
.tabs button:focus-visible{outline:3px solid var(--brown);outline-offset:2px;border-radius:8px}
.run{position:absolute;bottom:0;height:7px;left:0;width:0;border-radius:4px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--accent) 0 11px,transparent 11px 16px);
  transition:left .26s cubic-bezier(.5,0,.3,1),width .26s cubic-bezier(.5,0,.3,1)}
.run::after{content:'';position:absolute;right:-5px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.55)}

.mat{position:relative;z-index:1;aspect-ratio:1.45;overflow:hidden;background:rgba(150,115,70,.10)}
.mat::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(45,28,14,.55),inset 0 8px 16px rgba(0,0,0,.30),inset 0 -2px 8px rgba(0,0,0,.12)}
.mat canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:none;z-index:2}
.empty{position:absolute;inset:14px;border:3px dashed rgba(116,84,33,.45);border-radius:10px;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--soft);font-weight:700}
#yarn{position:absolute;left:-50px;top:-64px;width:calc(100% + 100px);height:calc(100% + 140px);pointer-events:none;z-index:5}

.linger{position:relative;text-align:center;font-size:clamp(20px,2.3vw,31px);line-height:1.2;margin-top:20px;color:var(--brown)}
.linger .u{display:block;height:6px;margin:10px auto 0;width:0;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 11px,transparent 11px 16px)}
.linger .u.go{animation:thread .9s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes thread{from{width:0}to{width:min(100%,520px)}}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:center;align-items:center;margin-top:10px;font-size:14px;text-align:center}
.meta b{color:var(--brown)}
.banner{display:none;background:#FBE7EA;border:2px dashed #C76A80;color:var(--warn);padding:10px 14px;border-radius:12px;margin-top:8px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}

/* buttons */
.btn{position:relative;font:inherit;font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;border:0;cursor:pointer;color:var(--brown);background:var(--cream);box-shadow:0 0 0 2px var(--brown),0 3px 0 2px rgba(116,84,33,.35);transition:transform .15s ease,box-shadow .15s ease}
.btn::after{content:'';position:absolute;inset:4px;border-radius:999px;border:2px dashed rgba(116,84,33,.45);pointer-events:none}
.btn.primary{background:var(--brown);color:#FFF8E8}
.btn.primary::after{border-color:rgba(255,248,232,.55)}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 2px var(--brown),0 1px 0 2px rgba(116,84,33,.35)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.link:focus-visible,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.link{border:0;background:none;color:var(--soft);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px 6px}

/* cards */
.card{position:relative;background:rgba(252,247,238,.88);border-radius:20px;padding:20px 22px 16px;box-shadow:0 8px 20px rgba(80,55,25,.18),0 1px 2px rgba(80,55,25,.25)}
.card::before{content:'';position:absolute;inset:7px;border:2px dashed rgba(116,84,33,.42);border-radius:14px;pointer-events:none}
.card h2{margin:0 0 10px;font-size:20px;line-height:1.25}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 24%,#fff);border:2px solid color-mix(in srgb,var(--accent) 70%,var(--brown))}
.muted{color:var(--soft);font-size:14px}
.reading{background:rgba(255,255,255,.6);border-left:5px solid var(--accent);padding:9px 14px;border-radius:0 12px 12px 0;margin:12px 0}
.reading small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:2px}
.thread{display:flex;flex-direction:column;gap:9px;margin:12px 0;max-height:340px;overflow-y:auto;padding:3px}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;line-height:1.45;overflow-wrap:anywhere}
.bub.agent{align-self:flex-start;border:2px dashed rgba(116,84,33,.55);background:rgba(255,255,255,.55);font-size:17px}
.bub.me{align-self:flex-end;background:#EFDFC0;border:2px solid rgba(116,84,33,.35);font-size:15px}
.bub .ack{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
.dots{animation:pulse 1s infinite;letter-spacing:.2em}
.say{display:flex;gap:10px;align-items:flex-end;margin-top:8px}.say textarea{min-height:52px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
textarea{width:100%;min-height:72px;font:inherit;font-size:15px;padding:9px 12px;border:2px solid rgba(116,84,33,.45);border-radius:12px;color:var(--brown);background:rgba(255,255,255,.75);resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
details{margin-top:10px;font-size:14px}summary{cursor:pointer;color:var(--soft);font-weight:700}
.log{font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:var(--brown);margin-top:6px}
.skeleton{height:14px;border-radius:7px;background:linear-gradient(90deg,#EBDDC3,#FBF5EA,#EBDDC3);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}

/* fabric */
.fabwrap{position:relative}
.fabwrap canvas{display:block;width:100%}
.shuttle{position:absolute;left:0;right:0;top:0;height:6px;border-radius:3px;opacity:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--accent) 0 11px,transparent 11px 16px);filter:drop-shadow(0 0 4px var(--accent))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border:2px solid rgba(116,84,33,.4);border-radius:999px;background:rgba(255,255,255,.55);color:var(--brown);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--brown);background:#EFDFC0}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const qs = new URLSearchParams(location.search);
const PREVIEW = qs.has('preview');
const API = (qs.get('api') || '').replace(/\/$/, '');
if (qs.get('token')) sessionStorage.setItem('kr_token', qs.get('token'));
const TOKEN = sessionStorage.getItem('kr_token') || '';
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 'week', S = null, busy = false, focus = null, formMode = null, knitToken = 0, pendingReply = '', more = false, lastKey = '', lastFab = '', unrav = null;

/* ---------- API ---------- */
async function api(path, opts = {}) {
  if (PREVIEW) return previewApi(path, opts);
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN } });
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });
const stateUrl = () => `/state?window=${W}&tz=${new Date().getTimezoneOffset()}`;
function banner(msg) { const b = $('banner'); b.textContent = msg || ''; b.style.display = msg ? 'block' : 'none'; }

async function refresh() {
  if (busy) return null;
  try { S = await api(stateUrl()); banner(''); render(); return true; }
  catch (e) { banner("Can't reach the agent. Is the Colab notebook running, and is the token right?"); return false; }
}
async function act(fn) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // let the card re-render even if the text box had focus
  const wasReply = !!pendingReply;
  busy = true; render();
  let restore = '';
  try { S = await fn(); banner(''); }
  catch (e) { restore = pendingReply; banner('Something went wrong: ' + String(e.message).slice(0, 160)); }
  busy = false; formMode = null; pendingReply = ''; more = false; render();
  if (restore && $('say')) $('say').value = restore;
  else if (wasReply && $('say')) $('say').focus({ preventScroll: true });
  const th = $('thread'); if (th && th.children.length > 2) th.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------- stitch rendering ---------- */
function stitch(ctx, x, y, w, h, c, alpha = 1) {
  const [r, g, b] = c, k = v => Math.max(0, Math.min(255, v | 0));
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `rgb(${k(r*.5)},${k(g*.5)},${k(b*.5)})`; ctx.fillRect(x, y, w, h);
  ctx.lineCap = 'round'; const lw = w * .38;
  const leg = dx => { ctx.beginPath();
    ctx.moveTo(x + w*.16 + dx, y + h*.10); ctx.quadraticCurveTo(x + w*.22 + dx, y + h*.62, x + w*.5 + dx, y + h*.92);
    ctx.moveTo(x + w*.84 + dx, y + h*.10); ctx.quadraticCurveTo(x + w*.78 + dx, y + h*.62, x + w*.5 + dx, y + h*.92); };
  ctx.strokeStyle = `rgb(${r|0},${g|0},${b|0})`; ctx.lineWidth = lw; leg(0); ctx.stroke();
  ctx.strokeStyle = `rgb(${k(r*1.2+18)},${k(g*1.2+18)},${k(b*1.2+18)})`; ctx.lineWidth = lw * .3; leg(-lw*.12); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* ---------- panels ---------- */
const MODE = { ambient: 'Stitching quietly', reflecting: 'Reflecting', revising: 'Re-weaving', replying: 'Listening' };

const CONF = { low: 'Loose', medium: 'Snug', high: 'Firm' };

function bubbles(R, extra) {
  const th = (R.thread && R.thread.length) ? R.thread : [{ role: 'agent', question: R.question }];
  let h = th.map(t => t.role === 'user' ? `<div class="bub me">${esc(t.text)}</div>`
    : `<div class="bub agent">${t.ack ? `<span class="ack">${esc(t.ack)}</span>` : ''}${esc(t.question || (t.ready ? 'Does this capture it?' : ''))}</div>`).join('');
  if (extra) h += `<div class="bub me">${esc(extra)}</div><div class="bub agent"><span class="dots">…</span></div>`;
  return `<div class="thread" id="thread">${h}</div>`;
}

function reflHTML() {
  const R = S.reflection;
  if (pendingReply && R && R.thread)
    return `<p><span class="tag">${CONF[R.confidence] || R.confidence} stitching</span> <b>${esc(R.topic_label)}</b></p><div class="reading"><small>Our reading so far</small>${esc(R.insight)}</div>` + bubbles(R, pendingReply);
  if (busy || S.mode === 'revising') return '<p class="muted">Reading the weave…</p><div class="skeleton"></div><div class="skeleton" style="width:70%"></div>';
  if (!S.has_data) return '<p class="muted">No traces in this window yet. The extension adds a stitch every time you spend a few seconds on a page.</p>';
  if (!R) return `<p class="muted">The agent is staying quiet until you ask. Open a reflection when you want to hear what it noticed.</p>`;
  if (R.status === 'waiting') return `<p><span class="tag">Waiting</span></p><p>${esc(R.message)}</p><div class="row"><button class="btn" data-a="close">OK</button></div>`;
  const talked = (R.thread || []).some(t => t.role === 'user');
  const ev = `<details><summary>Why am I seeing this?</summary><p>${esc(R.evidence)}.</p><p class="muted">Source: ${R.source === 'fallback' ? 'built-in rule (the model did not return a valid reading)' : 'agent reading of counted evidence'}.</p></details>`;
  const head = `<p><span class="tag">${CONF[R.confidence] || R.confidence} stitching</span> <b>${esc(R.topic_label)}</b></p>`;
  const saw = R.what_i_saw && !talked ? `<p class="muted">On the page: ${esc(R.what_i_saw)}</p>` : '';
  if (R.status === 'accepted' || R.status === 'edited')
    return head.replace(/(Loose|Snug|Firm) stitching/, 'Firm stitching') + `<div class="reading"><small>${talked ? 'Our reading' : 'Your reading'}</small>${esc(R.insight)}</div>`
      + `<p class="muted">${R.status === 'edited' ? 'Rewritten by you.' : 'You confirmed this.'} The thread is now firm.</p>`
      + (talked ? `<details><summary>Our conversation</summary>${bubbles(R)}</details>` : '') + ev;
  const reading = `<div class="reading"><small>${talked ? 'Our reading so far' : 'First reading'}</small>${esc(R.insight)}</div>`;
  const wrapUp = R.ready && !more;
  const form = formMode ? `<textarea id="note" placeholder="${formMode === 'reject' ? 'What is actually going on? The agent will treat this as true.' : ''}">${formMode === 'edit' ? esc(R.insight) : ''}</textarea>
      <div class="row"><button class="btn primary" data-a="send">${formMode === 'reject' ? 'Send to the agent' : 'Save my version'}</button><button class="btn" data-a="cancel">Cancel</button></div>`
    : (wrapUp ? '' : `<div class="say"><textarea id="say" rows="2" placeholder="Answer in your own words…"></textarea><button class="btn primary" data-a="say">Send</button></div>`)
      + `<div class="row"><button class="btn ${wrapUp ? 'primary' : ''}" data-a="accept">${talked || R.ready ? 'Save our reading' : 'That fits'}</button><button class="btn" data-a="reject">Not quite…</button><button class="btn" data-a="edit">Edit</button>${wrapUp ? '<button class="link" data-a="more">Keep talking</button>' : ''}<button class="link" data-a="close">Not now</button></div>`;
  return head + reading + saw + bubbles(R) + form + ev;
}

function render() {
  if (!S) return;
  const mode = busy && pendingReply ? 'replying' : (busy && S.mode === 'ambient' ? 'reflecting' : S.mode);
  $('modePill').dataset.mode = mode; $('modeTxt').textContent = MODE[mode];
  $('trackTxt').textContent = S.tracking.paused ? 'tracking paused' : `tracking · ${S.tracking.pages} pages`;
  $('pauseBtn').textContent = S.tracking.paused ? 'Resume tracking' : 'Pause tracking';
  setWinUI();
  $('openBtn').style.display = S.mode === 'ambient' ? '' : 'none'; $('openBtn').disabled = busy || !S.has_data;
  $('demoBtn').style.display = S.has_data || PREVIEW ? 'none' : '';
  $('forgetBtn').style.display = focus ? '' : 'none';
  const T = S.top_page;
  $('topMeta').innerHTML = T ? `<span><b>${esc(T.domain)}</b> · ${esc(T.title)} · ${Math.round(T.dwell_s / 60 * 10) / 10} min</span>` : 'No traces yet.';

  $('logTxt').textContent = S.log.length ? S.log.join('\n') : 'No tool calls yet.';
  $('transTxt').textContent = S.transitions.length ? S.transitions.map(t => `${t.from} —${t.event}→ ${t.to}`).join('\n') : 'No transitions yet.';
}

}

async function previewApi(path, opts) {

    if (body.action === 'reject') { tr('reflecting', 'reject', 'revising'); tr('revising', 'revised', 'reflecting'); PS.reflection = { ...PR.revised };
      PS.log = ['get_memory({})  ← sees the rejection and the note', 'find_patterns({"window": "week"})', 'propose_reflection({"pattern_id": "rising:etsy.com", reframed ...})']; } }
