<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
design plan
layout: the marbled sage/moss/cream blur (image 1) is the background of the ENTIRE page, fixed behind every section -- not just a hero band. All content sits on top in white/cream text, glass-panel cards, modern feel. Only the words and one small "color of the day" swatch change per day; the background texture never changes.
color (FIXED, never derived from the day's data): --bg deep moss (solid under the blur), --ink warm white, --muted translucent white, --accent light sage (pops on dark), --caution warm sand, --line translucent white hairline, --glass translucent white panel fill. The day's own gradient hex codes appear ONLY as a labeled swatch in "Color of the day" -- never as page chrome.
type: 'Fraunces' italic for display (characterful, editorial), 'Inter' for body/labels, tracked small-caps for eyebrows, all reversed to white on the image background
-->
<title>September 28 Reading</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #1B2317;
    --ink: #F7F4EA;
    --muted: rgba(247, 244, 234, 0.68);
    --accent: #A9C48C;
    --accent-soft: rgba(169, 196, 140, 0.22);
    --caution: #E3B98B;
    --caution-soft: rgba(227, 185, 139, 0.2);
    --line: rgba(247, 244, 234, 0.18);
    --glass: rgba(247, 244, 234, 0.08);
    --glass-strong: rgba(247, 244, 234, 0.14);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
  }

  /* ---------- Background: the marbled sage/moss/cream blur runs the
     full page, fixed behind every section -- not a hero band. Never
     repainted from the day's gradient reply; that stays confined to
     its own labeled swatch in "Color of the day". ---------- */
  .page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--bg);
  }
  .page-bg::before {
    content: "";
    position: absolute;
    inset: -20%;
    filter: blur(80px);
    opacity: 0.95;
    background:
      radial-gradient(32% 34% at 18% 12%, #7A9163 0%, transparent 68%),
      radial-gradient(38% 40% at 82% 8%, #3E4F30 0%, transparent 70%),
      radial-gradient(40% 42% at 88% 46%, #C9C3A4 0%, transparent 68%),
      radial-gradient(36% 38% at 12% 48%, #2A3B22 0%, transparent 70%),
      radial-gradient(45% 46% at 70% 82%, #6C8354 0%, transparent 70%),
      radial-gradient(40% 42% at 20% 90%, #1D2917 0%, transparent 72%),
      radial-gradient(30% 34% at 50% 55%, #B8B191 0%, transparent 65%);
  }
  /* subtle darkening so white text stays legible over the lighter blobs */
  .page-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(14, 18, 11, 0.35), rgba(14, 18, 11, 0.5) 40%, rgba(14, 18, 11, 0.6));
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 20px;
  }

  /* ---------- Hero ---------- */
  .hero {
    padding: 56px 4px 8px;
  }
  .hero-inner { max-width: 600px; margin: 0 auto; }
  .eyebrow {
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.9rem, 7vw, 2.7rem);
    line-height: 1.15;
    margin: 0 0 14px;
    text-wrap: balance;
    color: var(--ink);
  }
  .hero p.lede {
    font-size: 1rem;
    color: var(--muted);
    max-width: 46ch;
    margin: 0;
  }

  /* ---------- Sections ---------- */
  section { padding-block: 40px; }
  section + section { border-top: 1px solid var(--line); }

  h2 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 18px;
  }

  .reading-text {
    font-size: 1.05rem;
    max-width: 52ch;
    margin: 0 0 24px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--ink);
  }
  .chip .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .chip.favor { background: var(--accent-soft); border-color: transparent; }
  .chip.caution { background: var(--caution-soft); border-color: transparent; }
  .chip .label { color: var(--muted); }
  .chip .value { font-weight: 600; }

  /* ---------- Gradient ---------- */
  .gradient-bar {
    /* Placeholder only -- overwritten by render() with the day's actual
       gradient. This is the one place the day's color is allowed to show. */
    height: 96px;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--accent-soft) 0%, var(--accent) 100%);
    border: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .hex-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .hex-row span { white-space: nowrap; }
  .today-meta {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .today-meta b { color: var(--ink); font-weight: 600; }

  /* ---------- Music card ---------- */
  .music-meta { margin: 0 0 14px; }
  .music-meta .sub { color: var(--muted); font-size: 0.85rem; margin: 4px 0 0; }

  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(14, 18, 11, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
  }
  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .video-cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.35));
  }
  .video-cover .play-badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .video-cover .play-badge svg { width: 20px; height: 20px; fill: #14190F; }
  .video-note {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  footer {
    padding-block: 32px 48px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  footer .rule {
    width: 40px;
    height: 1px;
    background: var(--line);
    margin-bottom: 16px;
  }

  @media (max-width: 420px) {
    .hero { padding: 36px 4px 4px; }
  }
</style>

<!--
  TEMPLATE CONTRACT
  Everything below this line is one fixed page style. The only thing that
  changes day to day is the READING object in the script at the bottom --
  it's shaped to match exactly what send_daily_reading_email already has on
  hand (day_luck's output, color_gradient's hex stops, playlist_vibe's
  genre/tempo, and a found video/playlist id). Swap the object, the page
  stays the same.
-->

<div class="page-bg" aria-hidden="true"></div>

<div class="page">

  <div class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroHeadline"></h1>
      <p class="lede" id="heroLede"></p>
    </div>
  </div>

  <section>
    <p class="eyebrow">Five Elements</p>
    <h2 id="elementsHeadline"></h2>
    <p class="reading-text" id="elementsReading"></p>
    <div class="chips" id="elementsChips"></div>
  </section>

  <section>
    <p class="eyebrow">Color of the day</p>
    <h2 id="colorHeadline"></h2>
    <div class="gradient-bar" id="gradientBar" role="img"></div>
    <div class="hex-row" id="hexRow"></div>
    <div class="today-meta" id="colorMeta"></div>
  </section>

  <section>
    <p class="eyebrow">Music for the day</p>
    <h2 id="musicHeadline"></h2>
    <div class="music-meta"><p class="sub" id="musicSub"></p></div>
    <div class="video-frame" id="videoFrame">
      <button class="video-cover" id="videoCover" aria-label="Play playlist">
        <span class="play-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </button>
    </div>
    <p class="video-note">Tap to play, right in the page -- no separate tab.</p>
  </section>

  <footer>
    <div class="rule"></div>
    Generated automatically by Your Lucky Charm Agent, from today's check-in reply.
  </footer>

</div>

<script>
  // ---- The only thing that changes day to day. Shaped to match what
  // send_daily_reading_email already receives from day_luck, color_gradient
  // and playlist_vibe -- swap this object for the day's real values. ----
  const READING = {
  "date": "September 28, 2026",
  "name": "Stacey",
  "animal": "Snake",
  "userElement": "Metal",
  "dayElement": "Metal",
  "relationship": "matching",
  "readingText": "Stacey, as a Metal Snake, today is a Metal day, matching your own Metal energy — a balanced, steady day.",
  "favorColor": {
    "name": "White",
    "hex": "#FFFFFF"
  },
  "cautionColor": {
    "name": "Green",
    "hex": "#008000"
  },
  "luckyDirection": "West",
  "colorWord": "Purple",
  "mood": "Tired",
  "energy": 1,
  "gradient": [
    "#710071",
    "#800080",
    "#8F008F"
  ],
  "genre": "soft acoustic",
  "tempo": "slow, minimal",
  "youtubePlaylistId": "PL1RKSM6XF23n-81XAoTZPbTXcfAOGbTTF",
  "playlistTitle": "Slow Acoustic Songs"
};

  function el(tag, className, html) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function render(r) {
    document.getElementById("heroEyebrow").textContent =
      `Your Lucky Charm Agent · ${r.date}`;
    document.getElementById("heroHeadline").textContent =
      `${r.name}, today is a ${r.dayElement} day.`;
    document.getElementById("heroLede").textContent =
      r.userElement === r.dayElement
        ? `Your own element is ${r.userElement} too — a matching, balanced day. Here's the full reading.`
        : `Your own element is ${r.userElement} — here's how today's ${r.dayElement} energy relates to it.`;

    // Background texture is fixed CSS (.page-bg) -- never repainted from
    // the day's gradient. Only the words change per day.

    document.getElementById("elementsHeadline").textContent =
      r.relationship === "matching" ? "A balanced, steady day" : `A ${r.relationship} day`;
    document.getElementById("elementsReading").textContent = r.readingText;

    const chips = document.getElementById("elementsChips");
    chips.appendChild(el("span", "chip favor", `<span class="dot" style="background:${r.favorColor.hex}"></span><span class="label">Favor</span> <span class="value">${r.favorColor.name}</span>`));
    chips.appendChild(el("span", "chip caution", `<span class="dot" style="background:${r.cautionColor.hex}"></span><span class="label">Caution</span> <span class="value">${r.cautionColor.name}</span>`));
    chips.appendChild(el("span", "chip", `<span class="label">Direction</span> <span class="value">${r.luckyDirection}</span>`));

    document.getElementById("colorHeadline").textContent =
      `${r.colorWord}, ${r.mood.toLowerCase()}, energy ${r.energy}`;
    document.getElementById("gradientBar").style.background =
      `linear-gradient(90deg, ${r.gradient.join(", ")})`;
    document.getElementById("gradientBar").setAttribute("aria-label",
      `Smooth gradient through ${r.gradient.join(", ")}`);
    const hexRow = document.getElementById("hexRow");
    r.gradient.forEach(hex => hexRow.appendChild(el("span", null, hex)));
    const colorMeta = document.getElementById("colorMeta");
    colorMeta.appendChild(el("span", null, `Mood: <b>${r.mood}</b>`));
    colorMeta.appendChild(el("span", null, `Energy: <b>${r.energy} / 5</b>`));

    document.getElementById("musicHeadline").textContent =
      `${r.genre[0].toUpperCase() + r.genre.slice(1)}`;
    document.getElementById("musicSub").textContent =
      `${r.playlistTitle} · ${r.tempo} tempo`;

    const cover = document.getElementById("videoCover");
    const frame = document.getElementById("videoFrame");
    cover.addEventListener("click", () => {
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.youtube.com/embed/videoseries?list=${r.youtubePlaylistId}&autoplay=1`;
      iframe.title = r.playlistTitle;
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      frame.innerHTML = "";
      frame.appendChild(iframe);
    }, { once: true });
  }

  render(READING);
</script>
